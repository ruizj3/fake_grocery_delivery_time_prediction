name: Automated Drift Monitoring

on:
  schedule:
    # Run drift check daily at 9 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  drift-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      
      - name: Run drift check
        id: drift_check
        run: |
          python check_drift.py --force > drift_output.txt 2>&1
          cat drift_output.txt
        continue-on-error: true
      
      - name: Check for drift alerts
        id: check_alerts
        run: |
          ALERTS=$(python -c "
          from delivery_ml.monitoring.auto_drift_monitor import AutoDriftMonitor
          monitor = AutoDriftMonitor()
          alerts = monitor.get_unacknowledged_alerts()
          print(len(alerts))
          monitor.close()
          ")
          echo "alert_count=$ALERTS" >> $GITHUB_OUTPUT
          
          if [ "$ALERTS" -gt 0 ]; then
            echo "::warning::Drift detected! $ALERTS unacknowledged alerts"
            exit 1
          fi
      
      - name: Upload drift monitoring database
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: drift-monitoring-db
          path: drift_monitoring.db
          retention-days: 30
      
      - name: Send notification on drift
        if: failure()
        run: |
          echo "Drift detected! Please review the drift monitoring results."
          # Add email/Slack notification here
          # Example: curl -X POST $SLACK_WEBHOOK -d '{"text":"Drift detected!"}'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
